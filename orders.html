<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سفارش‌های ثبت شده</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

<h1>📋 سفارش‌های ثبت شده</h1>

<div id="ordersList"></div>


</div>



<script>


function loadOrders(){


let orders = JSON.parse(localStorage.getItem("orders")) || [];

let box = document.getElementById("ordersList");


box.innerHTML = "";


if(orders.length === 0){

box.innerHTML = "<p>هنوز سفارشی ثبت نشده است.</p>";

return;

}



orders.forEach(function(order,index){


box.innerHTML += `

<div class="order-box">

<h3>👤 ${order.name}</h3>

<p>📞 شماره تماس: ${order.phone}</p>

<p>📅 تاریخ: ${order.date}</p>


<p>💰 مبلغ کل:
${order.total.toLocaleString()} تومان
</p>


<p>💵 بیعانه:
${order.deposit.toLocaleString()} تومان
</p>


<p>💳 مانده:
${order.remain.toLocaleString()} تومان
</p>


<button onclick="deleteOrder(${index})">

🗑 حذف سفارش

</button>


</div>

<hr>

`;

});


}



function deleteOrder(index){


let orders = JSON.parse(localStorage.getItem("orders")) || [];


orders.splice(index,1);


localStorage.setItem("orders", JSON.stringify(orders));


alert("سفارش حذف شد");


loadOrders();


}



loadOrders();


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت سفارش مشتری</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cutmaster.css">

</head>


<body>


<div class="container">


<h1>📋 ثبت سفارش مشتری</h1>


<label>نام مشتری</label>
<input id="name" type="text" placeholder="نام مشتری">


<label>شماره تماس</label>
<input id="phone" type="text" placeholder="شماره تماس">


<label>مبلغ کل قرارداد</label>
<input id="total" type="number" placeholder="مثلا 350000000">


<label>مبلغ بیعانه</label>
<input id="deposit" type="number" placeholder="مثلا 100000000">


<button onclick="saveOrder()">
ثبت سفارش
</button>


<button onclick="copyOrder()">
کپی اطلاعات سفارش
</button>


<div id="result"></div>


</div>



<script>


let orderText = "";

let editIndex = null;



window.onload = function(){


let edit = localStorage.getItem("editOrder");


if(edit !== null){


editIndex = Number(edit);


let orders = JSON.parse(localStorage.getItem("orders")) || [];


let order = orders[editIndex];


if(order){


document.getElementById("name").value = order.name;

document.getElementById("phone").value = order.phone;

document.getElementById("total").value = order.total;

document.getElementById("deposit").value = order.deposit;


}


localStorage.removeItem("editOrder");


}


}




function saveOrder(){


let name = document.getElementById("name").value.trim();

let phone = document.getElementById("phone").value.trim();

let total = Number(document.getElementById("total").value);

let deposit = Number(document.getElementById("deposit").value);



if(name === "" || phone === "" || total === 0){

alert("لطفا اطلاعات سفارش را کامل کنید");

return;

}



if(deposit > total){

alert("مبلغ بیعانه نمی‌تواند بیشتر از مبلغ کل باشد");

return;

}



let remain = total - deposit;



let order = {


name:name,

phone:phone,

total:total,

deposit:deposit,

remain:remain,

date:new Date().toLocaleDateString("fa-IR")


};




let orders = JSON.parse(localStorage.getItem("orders")) || [];



if(editIndex !== null){


orders[editIndex] = order;


alert("✅ سفارش ویرایش شد");


}else{


orders.push(order);


alert("✅ سفارش جدید ذخیره شد");


}



localStorage.setItem("orders", JSON.stringify(orders));





orderText = `

📋 سفارش کابینت

👤 نام مشتری:
${name}


📞 شماره تماس:
${phone}


💰 مبلغ کل قرارداد:
${total.toLocaleString()} تومان


💵 مبلغ بیعانه:
${deposit.toLocaleString()} تومان


💳 مانده حساب:
${remain.toLocaleString()} تومان


📅 تاریخ:
${order.date}

`;



document.getElementById("result").innerText = orderText;



// پاک کردن فرم

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("total").value="";
document.getElementById("deposit").value="";


editIndex = null;


}





function copyOrder(){


if(orderText === ""){

alert("ابتدا سفارش را ثبت کنید");

return;

}


navigator.clipboard.writeText(orderText);


alert("📋 اطلاعات سفارش کپی شد");


}



</script>



</body>

</html>

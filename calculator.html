<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>محاسبه کابینت</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>محاسبه کابینت</h1>

<label>قیمت یک متر کابینت کامل</label>
<input id="price" type="number" placeholder="مثلا 35000000">


<label>واحد پول</label>
<select id="unit">
<option value="تومان">تومان</option>
<option value="ریال">ریال</option>
</select>


<label>متراژ کابینت پایین</label>
<input id="lower" type="number">


<label>متراژ کابینت بالا</label>
<input id="upper" type="number">


<label>ارتفاع باکس بالا</label>
<select id="height">

<option value="70">70 سانت</option>
<option value="90">90 سانت</option>
<option value="100">100 سانت</option>
<option value="110">110 سانت</option>
<option value="120">120 سانت</option>

</select>


<button onclick="calculate()">محاسبه قیمت</button>


<div id="result"></div>


</div>

<script>
alert("اتصال کد درست است");
</script>
<script src="script.js"></script>

</body>

</html>

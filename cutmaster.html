<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کات مستر | کابینت‌یار</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#f5f7fb;
    font-family:tahoma;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1,h2{
    color:#0F2A4A;
}

input,select,textarea{

width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;

}

button{

width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#0F2A4A;
color:white;
font-size:17px;
cursor:pointer;

}

button:hover{

background:#16406d;

}

table{

width:100%;
border-collapse:collapse;

}

th{

background:#0F2A4A;
color:white;
padding:12px;

}

td{

padding:10px;
border-bottom:1px solid #ddd;
text-align:center;

}

textarea{

height:140px;

}

</style>

</head>

<body>

<div class="container">

<h1>✂️ کات مستر</h1>

<p>سیستم هوشمند مدیریت برش ورق MDF</p>


<div class="card">

<h2>📦 مشخصات ورق</h2>

<label>ابعاد ورق</label>

<select>

<option>366 × 183</option>

<option>280 × 207</option>

<option>244 × 122</option>

</select>

<label>ضخامت</label>

<select>

<option>16 میلیمتر</option>

<option>18 میلیمتر</option>

<option>25 میلیمتر</option>

</select>

<label>جنس ورق</label>

<select>

<option>MDF</option>

<option>هایگلاس</option>

<option>پلی گلاس</option>

<option>ملامینه</option>

</select>

</div>


<div class="card">

<h2>➕ افزودن قطعه</h2>

<input placeholder="نام قطعه">

<input type="number" placeholder="طول (سانتی متر)">

<input type="number" placeholder="عرض (سانتی متر)">

<input type="number" placeholder="تعداد">

<button>افزودن قطعه</button>

</div>


<div class="card">

<h2>⚡ ورود سریع قطعات</h2>

<textarea placeholder="مثال:

درب 72×45×2
طبقه 55×45×6
بدنه 240×55×2"></textarea>

<button>افزودن لیست</button>

</div>


<div class="card">

<h2>📋 لیست قطعات</h2>

<table>

<tr>

<th>قطعه</th>

<th>طول</th>

<th>عرض</th>

<th>تعداد</th>

</tr>

</table>

</div>


<div class="card">

<button>🚀 شروع محاسبه چیدمان</button>

</div>

</div>

</body>

</html>
